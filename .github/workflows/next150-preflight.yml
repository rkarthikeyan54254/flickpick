name: Next 150 Preflight

on:
  push:
    branches:
      - certification-next-150-hi-ta-te-20261003

jobs:
  queue-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:next150queue
