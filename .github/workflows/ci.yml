name: CI

on:
  pull_request:
  push:
    branches:
      - sanghi-certified-batch-02-50-pr

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate:recert
      - run: npm run build
